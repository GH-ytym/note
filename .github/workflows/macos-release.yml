name: macOS server client

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS server URL
        required: true
        default: https://124.220.23.245/

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - name: Build server client
        working-directory: desktop
        env:
          NOTE_SERVER_URL: ${{ inputs.server_url }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node dist/scripts/prepare-server.cjs
          npx electron-builder --config electron-builder.server.cjs --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: note-server-mac-${{ matrix.arch }}
          path: |
            desktop/release/server/*.dmg
            desktop/release/server/*.zip
          if-no-files-found: error
